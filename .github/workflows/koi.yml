# Automatically updates all 6 git-koi bodies every night after midnight UTC
name: Git Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render Asagi
        uses: yalongwastaken/git-koi@v1
        with:
          body: asagi
          output-dir: koi/asagi

      - name: Render Black
        uses: yalongwastaken/git-koi@v1
        with:
          body: black
          output-dir: koi/black

      - name: Render Tea
        uses: yalongwastaken/git-koi@v1
        with:
          body: tea
          output-dir: koi/tea

      - name: Render Gold
        uses: yalongwastaken/git-koi@v1
        with:
          body: gold
          output-dir: koi/gold

      - name: Render Platinum
        uses: yalongwastaken/git-koi@v1
        with:
          body: platinum
          output-dir: koi/platinum

      - name: Render White
        uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi/white

      - name: Commit all 6 koi if changed
        shell: bash
        run: |
          git add koi/*/koi.gif koi/*/koi.png
          if git diff --cached --quiet; then
            echo "The koi are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "koi: draw the day's 6 koi [skip ci]"
          git pull --rebase origin main
          git push
