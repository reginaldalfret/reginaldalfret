# Automatically updates all 6 git-koi bodies every night after midnight UTC
name: Git Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup and render all 6 Git Koi varieties
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/git-koi-bin
          gh release download v1.0.2 --repo yalongwastaken/git-koi -p "git-koi-*-x86_64-unknown-linux-musl.tar.gz" -D /tmp/git-koi-bin --clobber
          tar -xzf /tmp/git-koi-bin/*.tar.gz -C /tmp/git-koi-bin
          
          # Find binary
          BIN=$(find /tmp/git-koi-bin -type f -name git-koi | head -n 1)
          chmod +x "$BIN"
          
          # Collect account snapshot once
          "$BIN" collect "${{ github.repository_owner }}" --output /tmp/snapshot.json
          
          # Render all 6 koi body types
          for body in asagi black tea gold platinum white; do
            mkdir -p "koi/$body"
            "$BIN" render /tmp/snapshot.json --output-dir "koi/$body" --body "$body"
          done

      - name: Commit all 6 koi if changed
        shell: bash
        run: |
          git add koi/*/koi.gif koi/*/koi.png
          if git diff --cached --quiet; then
            echo "The koi are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "koi: draw the day's 6 koi [skip ci]"
          git pull --rebase origin main
          git push
