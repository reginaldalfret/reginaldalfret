# Automatically updates all 6 git-koi bodies every night after midnight UTC
name: Git Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw Git Koi (All 6 Varieties)
        uses: reginaldalfret/git-koi-aquarium@v1
        with:
          login: ${{ github.repository_owner }}
          body: all
          output-dir: koi
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit all 6 koi and aquarium if changed
        shell: bash
        run: |
          git add koi/*/koi.gif koi/*/koi.png koi/aquarium.svg
          if git diff --cached --quiet; then
            echo "The koi are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "koi: draw the day's 6 koi and aquarium [skip ci]"
          git pull --rebase origin main
          git push
