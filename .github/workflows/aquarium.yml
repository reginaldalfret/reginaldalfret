name: Generate Code Aquarium

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/generate-aquarium.js

permissions:
  contents: write

concurrency: aquarium

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Code Aquarium SVG
        run: |
          node scripts/generate-aquarium.js

      - name: Commit and push changes
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aquarium.svg
          if git diff --staged --quiet; then
            echo "Aquarium SVG is unchanged; nothing to commit."
          else
            git commit -m "chore(aquarium): update code aquarium animation [skip ci]"
            git pull --rebase origin main
            git push
          fi
